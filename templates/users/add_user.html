{% extends "base.html" %}

{% block breadcrumb %}
Admin > Users > Add User
{% endblock %}

{% block title %}
Add User
{% endblock %}

{% block extra_css %}
<style>
    .form-wrapper {
        max-width: 900px;
        margin: auto;
    }

    .form-card {
        background: rgba(18, 23, 34, .85);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        padding: 35px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
    }

    .form-group input {
        width: 100%;
        min-width: 0;
        display: block;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
    }

    .form-title {
        margin-bottom: 10px;
    }

    .form-subtitle {
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .form-group.full {
        grid-column: 1/-1;
    }

    .form-group label {
        margin-bottom: 8px;
        display: block;
        font-size: 14px;
        color: #cbd5e1;
    }

    * {
        box-sizing: border-box;
    }

    .form-group label {
        line-height: 1.5;
    }

    .form-group input {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, .08);
        color: white;
        padding: 12px;
        border-radius: 10px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #25d0ff;
    }

    .upload-box {
        background: #0f172a;
        border: 2px dashed rgba(255, 255, 255, .15);
        border-radius: 16px;
        padding: 30px;
        text-align: center;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 30px;
    }

    .btn-cancel {
        background: #1e293b;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 12px;
    }

    .btn-save {
        background: linear-gradient(135deg, #25d0ff, #4f46e5);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
    }

    @media(max-width:768px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

    }
</style>
{% endblock %}

{% block content %}

<div class="form-wrapper">

    <div class="form-card">

        <h1 class="form-title">
            Register User
        </h1>

        <p class="form-subtitle">
            Add a new library member and register face recognition data.
        </p>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="form-group full">

                    <label>Full Name</label>

                    <input type="text" name="full_name" required>

                </div>

                <div class="form-group">

                    <label>Roll Number</label>

                    <input type="text" name="roll_no">

                </div>

                <div class="form-group">

                    <label>Department</label>

                    <input type="text" name="department">

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input type="text" name="phone">

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input type="email" name="email">

                </div>

                <div class="form-group full">

                    <label>Face Images (3–5 Recommended)</label>

                    <div class="upload-box">

                        <input type="file" name="face_images" accept=".jpg,.jpeg,.png" multiple required>

                    </div>

                </div>

            </div>

            <div class="form-actions">

                <a href="{{ url_for('users.users_page') }}" class="btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn-save">

                    Save User

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

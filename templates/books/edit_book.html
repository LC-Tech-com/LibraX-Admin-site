{% extends "base.html" %}

{% block breadcrumb %}
Admin > Books > Edit Book
{% endblock %}

{% block title %}
Edit Book
{% endblock %}

{% block extra_css %}
<style>
    .form-wrapper {
        max-width: 1000px;
        margin: auto;
    }

    .form-card {
        background: rgba(18, 23, 34, .85);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        padding: 35px;
    }

    .form-title {
        margin-bottom: 10px;
    }

    .form-subtitle {
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .form-group.full {
        grid-column: 1/-1;
    }

    .form-group label {
        margin-bottom: 8px;
        color: #cbd5e1;
        font-size: 14px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }

    .form-group {
        min-width: 0;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #25d0ff;
    }

    .book-info {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 25px;
    }

    .book-id {
        color: #25d0ff;
        font-weight: 600;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 30px;
    }

    .btn-cancel {
        background: #1e293b;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 12px;
    }

    .btn-save {
        background: linear-gradient(135deg, #25d0ff, #4f46e5);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
    }

    @media(max-width:768px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

    }
</style>
{% endblock %}

{% block content %}

<div class="form-wrapper">

    <div class="form-card">

        <h1 class="form-title">
            Edit Book
        </h1>

        <p class="form-subtitle">
            Update book information and inventory details.
        </p>

        <div class="book-info">

            <strong>Book ID:</strong>

            <span class="book-id">
                {{ book.book_id }}
            </span>

        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group full">

                    <label>Book Title</label>

                    <input type="text" name="title" value="{{ book.title }}" required>

                </div>

                <div class="form-group">

                    <label>Author</label>

                    <input type="text" name="author" value="{{ book.author or '' }}">

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category_id">

                        {% for category in categories %}

                        <option value="{{ category.id }}" {% if category.id==book.category_id %}selected{% endif %}>

                            {{ category.category_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Publisher</label>

                    <input type="text" name="publisher" value="{{ book.publisher or '' }}">

                </div>

                <div class="form-group">

                    <label>Publication Year</label>

                    <input type="number" name="publication_year" value="{{ book.publication_year or '' }}">

                </div>

                <div class="form-group">

                    <label>ISBN</label>

                    <input type="text" name="isbn" value="{{ book.isbn or '' }}">

                </div>

                <div class="form-group">

                    <label>Total Copies</label>

                    <input type="number" name="total_copies" value="{{ book.total_copies }}" min="1">

                </div>

            </div>

            <div class="form-actions">

                <a href="{{ url_for('books.books_page') }}" class="btn-cancel">

                    Cancel

                </a>

                <button type="submit" class="btn-save">

                    Update Book

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
